name: Stage 8 real-socket H2/H3 laboratory (not field)

on:
  push:
    branches: [update]
    paths:
      - 'scripts/field_h2_h3.py'
      - 'scripts/test_field_h2_h3.py'
      - '.github/workflows/stage8-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check stage-8 offline harness invariants
        run: python3 -m unittest discover -s scripts -p test_field_h2_h3.py -v

  h2-h3-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Install pinned runtime build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libclang-dev gcc g++ binutils unzip
          rustup toolchain install 1.99.1 --profile minimal
      - name: Build pinned NSS/Neqo native client
        run: python3 scripts/build_mozilla.py --version v0.0.0-ci
      - name: Real HTTP/2 + HTTP/3 sockets, verified echo, isolated loopback
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          echo_pid=""
          server_pid=""
          cleanup() {
            if [[ -n "$server_pid" ]]; then kill "$server_pid" 2>/dev/null || true; fi
            if [[ -n "$echo_pid" ]]; then kill "$echo_pid" 2>/dev/null || true; fi
            rm -rf "$work"
          }
          trap cleanup EXIT
          umask 077
          bundle="$(find dist -maxdepth 1 -name '*_linux_amd64_mozilla.tar.gz' -print -quit)"
          test -n "$bundle"
          tar -xzf "$bundle" -C "$work"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' \
            -keyout "$work/key.pem" -out "$work/cert.pem" >/dev/null 2>&1
          export FOXTUNNEL_USER=stage8-ci
          export FOXTUNNEL_PASSWORD
          FOXTUNNEL_PASSWORD="$(openssl rand -hex 32)"
          python3 scripts/echo_server.py --host 127.0.0.1 --port 19000 >"$work/echo.log" 2>&1 &
          echo_pid=$!
          "$work/vetroffproxy" server \
            --listen 127.0.0.1:18443 --h3-listen 127.0.0.1:18443 \
            --cert "$work/cert.pem" --key "$work/key.pem" \
            --allow-private >"$work/server.log" 2>&1 &
          server_pid=$!
          # Wait for the real server's TCP listener, not the worker's sleep.
          python3 - <<'PY'
          import socket, time
          for attempt in range(100):
              try:
                  with socket.create_connection(('127.0.0.1', 18443), .2):
                      break
              except OSError:
                  time.sleep(.1)
          else:
              raise SystemExit('server did not open TCP listener')
          PY
          python3 scripts/field_h2_h3.py \
            --binary "$work/vetroffproxy" \
            --server https://127.0.0.1:18443 --sni localhost --ca-cert "$work/cert.pem" \
            --target 127.0.0.1:19000 --rounds 3 --warmup 1 --parallel 2 \
            --bytes 131072 --timeout 15 \
            --out "$work/stage8-loopback.json"
          mkdir -p stage8-ci-output
          cp "$work/stage8-loopback.json" stage8-ci-output/report.json
          # Do not export the private CA/key, passwords, or raw process logs.
      - name: Upload laboratory results (NOT independent field data)
        uses: actions/upload-artifact@v4
        with:
          name: stage8-h2-h3-loopback-only
          path: stage8-ci-output/report.json
          if-no-files-found: error
          retention-days: 7
