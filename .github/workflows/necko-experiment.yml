name: Mozilla Necko source experiment
on:
  push:
    branches: [firefox, xfd, xfd-h3, xfd-arm64, xfd-identity]
    paths:
      - 'experiments/firefox-necko/patches/**'
      - 'experiments/firefox-necko/gecko.lock.json'
      - 'scripts/necko_platform.py'
      - 'scripts/test_necko_platform.py'
      - 'scripts/build_necko.py'
      - 'scripts/test_build_necko.py'
      - '.github/workflows/necko-experiment.yml'
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: necko-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: native (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            suffix: ''
          - arch: arm64
            runner: ubuntu-24.04-arm
            suffix: '-arm64'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      MOZBUILD_STATE_PATH: ${{ github.workspace }}/mozbuild
      MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: pip
      SCCACHE_DIR: ${{ github.workspace }}/necko-compiler-cache
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_VERBOSE_STATS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: vetroff
      - name: Source preparation tests
        working-directory: vetroff
        run: |
          python3 -m unittest discover -s scripts -p test_build_necko.py -v
          python3 -m unittest discover -s scripts -p test_necko_platform.py -v
          python3 -c 'import sys; sys.path.insert(0, "scripts"); from necko_platform import host_platform; assert host_platform() == "linux-${{ matrix.arch }}"'
      - name: Read locked Gecko revision
        id: lock
        working-directory: vetroff
        run: |
          python3 - <<'PY'
          import json, os
          lock = json.load(open('experiments/firefox-necko/gecko.lock.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('revision=' + lock['revision'] + '\n')
          PY
      - name: Make room for a full C++ build on the disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .
      - uses: actions/checkout@v4
        with:
          repository: mozilla-firefox/firefox
          ref: ${{ steps.lock.outputs.revision }}
          path: gecko
          fetch-depth: 1
      - uses: actions/cache@v4
        with:
          path: ${{ env.MOZBUILD_STATE_PATH }}
          key: necko-toolchains-ubuntu24${{ matrix.suffix }}-${{ steps.lock.outputs.revision }}
      - name: Restore compiled C and C++ cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: necko-compiler-ubuntu24${{ matrix.suffix }}-${{ steps.lock.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: necko-compiler-ubuntu24${{ matrix.suffix }}-${{ steps.lock.outputs.revision }}-
      - name: Bootstrap Mozilla build dependencies (C++ build, no artifact substitution)
        working-directory: gecko
        run: python3 mach --no-interactive bootstrap --application-choice=browser --no-agentic-tools
      - name: Build pinned Gecko with reviewed source patches
        id: build
        working-directory: vetroff
        run: python3 scripts/build_necko.py --source ../gecko --out ../necko-build --jobs 3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: vetroff/go.sum
      - name: Native H2 and H3 cold handoff and binary transfer
        working-directory: vetroff
        env:
          VETROFF_XPCSHELL: ${{ github.workspace }}/necko-build/obj/dist/bin/xpcshell
        run: go test -race ./experiments/firefox-necko -run '^TestGeckoCONNECTHandoff$' -v -count=1 -timeout=80s
      - name: Native H2 and H3 half-close gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: vetroff
        env:
          VETROFF_XPCSHELL: ${{ github.workspace }}/necko-build/obj/dist/bin/xpcshell
        run: go test -race ./experiments/firefox-necko -run '^TestGeckoCONNECT$' -v -count=1 -timeout=80s
      - name: Reject invalid proxy certificates before credentials
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: vetroff
        env:
          VETROFF_XPCSHELL: ${{ github.workspace }}/necko-build/obj/dist/bin/xpcshell
        run: go test -race ./experiments/firefox-necko -run '^TestGeckoTrustBeforeCredentials$' -v -count=1 -timeout=60s
      - name: Local TCP FIN and reverse H2/H3 half-close gates
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: vetroff
        env:
          VETROFF_XPCSHELL: ${{ github.workspace }}/necko-build/obj/dist/bin/xpcshell
        run: go test -race ./experiments/firefox-necko -run '^Test(GeckoLocalHalfClose|GeckoReverseHalfClose|ReverseHalfClosePeers)$' -v -count=3 -timeout=180s
      - name: Concurrent streams, cancellation and H3-only failure policy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: vetroff
        env:
          VETROFF_XPCSHELL: ${{ github.workspace }}/necko-build/obj/dist/bin/xpcshell
        run: go test -race ./experiments/firefox-necko -run '^TestGecko(ConcurrentCONNECT|Cancellation|H3NoTCPFallback)$' -v -count=3 -timeout=120s
      - name: Full Firefox versus Necko helper wire measurements
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: vetroff
        env:
          VETROFF_XPCSHELL: ${{ github.workspace }}/necko-build/obj/dist/bin/xpcshell
          VETROFF_FINGERPRINT_OUT: ${{ github.workspace }}/necko-fingerprint/observations
        run: |
          go test -race ./experiments/firefox-necko -run '^Test(Fingerprint|GeckoBrowserFingerprint)' -v -count=3 -timeout=180s
          python3 scripts/compare_necko_firefox.py --observations ../necko-fingerprint/observations --out ../necko-fingerprint/comparison.json
      - name: Keep full Firefox comparison observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: necko-source-firefox-fingerprint${{ matrix.suffix }}
          path: necko-fingerprint/
          if-no-files-found: ignore
          retention-days: 14
      - name: Operational idle/drain bounds and sustained resource gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: vetroff
        env:
          VETROFF_XPCSHELL: ${{ github.workspace }}/necko-build/obj/dist/bin/xpcshell
          VETROFF_SOAK_SECONDS: '60'
          VETROFF_OPERATIONS_OUT: ${{ github.workspace }}/necko-operations
        run: go test -race ./experiments/firefox-necko -run '^TestGecko(IdleAndDrainLimits|Soak)$' -v -count=1 -timeout=240s
      - name: Keep operational resource observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: necko-source-operations${{ matrix.suffix }}
          path: necko-operations/
          if-no-files-found: ignore
          retention-days: 14
      - name: Archive the patched runtime for repeatable native diagnostics
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          tar -chf - -C necko-build/obj/dist/bin . | zstd -3 -T0 > necko-build/runtime.tar.zst
      - name: Keep patched runtime
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: necko-linux-${{ matrix.arch }}-runtime
          path: necko-build/runtime.tar.zst
          if-no-files-found: error
          retention-days: 7
      - name: Keep source and runtime provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: necko-source-provenance${{ matrix.suffix }}
          path: |
            vetroff/experiments/firefox-necko/gecko.lock.json
            vetroff/experiments/firefox-necko/patches/
            necko-build/provenance.json
            necko-build/mozconfig
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compiled cache even when native compilation or gates fail
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
