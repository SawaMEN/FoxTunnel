name: NSS ClientHello experiment
on:
  push:
  pull_request:
jobs:
  nss:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Install NSS and NSPR build headers
        run: sudo apt-get update -qq && sudo apt-get install -y libnss3-dev libnspr4-dev pkg-config
      - name: Build native NSS probe
        run: |
          pkg-config --modversion nss nspr
          cc -std=c11 -Wall -Wextra -Werror -O2 $(pkg-config --cflags nss nspr) experiments/nss-clienthello/main.c -o /tmp/nss-clienthello $(pkg-config --libs nss nspr)
          go build -o /tmp/ft-fingerprint ./cmd/ft-fingerprint
      - name: Capture real NSS ClientHello over loopback
        shell: bash
        run: |
          set -euo pipefail
          /tmp/ft-fingerprint --listen 127.0.0.1:19443 --out /tmp/nss.json &
          capture_pid=$!
          trap 'kill "$capture_pid" 2>/dev/null || true' EXIT
          sleep 1
          /tmp/nss-clienthello 19443 example.org
          wait "$capture_pid"
          python3 - <<'PY'
          import json
          with open('/tmp/nss.json', encoding='utf-8') as file:
              profile = json.load(file)
          assert profile['legacy_version'] == 771, profile
          assert 772 in profile['supported_versions'], profile
          assert 'h2' in profile['alpn'], profile
          print('Captured NSS TLS ClientHello: ALPN', profile['alpn'])
          PY
      - name: Enforce NSS protocol-core boundaries
        run: python3 scripts/check_core_boundaries.py --tags nss
      - name: Test NSS data transport with race detector
        run: go test -race -tags nss ./... -count=1 -timeout=240s
      - name: Repeat core destination and managed UDP revocation security
        run: go test -race -tags nss ./internal/tunnel -run '^TestSecurityStage5|^TestVerifiedSNIAndPinNSS$|^TestAccessRevocationIsolationNSS$' -count=3 -timeout=120s
      - name: Vet NSS adapter
        run: go vet -tags nss ./...
      - name: Build NSS client
        run: go build -tags nss -o /tmp/foxtunnel-nss ./cmd/foxtunnel
      - name: Проверка Go-уязвимостей сборки NSS
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags=nss ./...
