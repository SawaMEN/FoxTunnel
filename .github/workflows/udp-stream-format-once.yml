name: One-time UDP stream gofmt
on:
  push:
    paths:
      - .github/workflows/udp-stream-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format UDP stream Go changes and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd/foxtunnel/main.go foxtunnel.go internal/tunnel/udp_stream_client.go internal/tunnel/udp_stream_server.go internal/tunnel/udp_stream_test.go internal/tunnel/udp_client.go internal/tunnel/client.go internal/tunnel/server.go internal/tunnel/access.go internal/udpproto/frame.go internal/udpproto/frame_test.go
          git rm -f .github/workflows/udp-stream-format-once.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format UDP stream v2 and remove temporary formatter'
          git push origin "HEAD:${GITHUB_REF_NAME}"
