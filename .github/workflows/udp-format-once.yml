name: One-time UDP gofmt
on:
  push:
    paths:
      - .github/workflows/udp-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format Go and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd internal examples foxtunnel*.go integration/external
          git rm -f .github/workflows/udp-format-once.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: gofmt UDP relay and remove one-time formatter'
          git push origin "HEAD:${GITHUB_REF_NAME}"
