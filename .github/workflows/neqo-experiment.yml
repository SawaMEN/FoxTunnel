name: Mozilla Neqo client experiment
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  neqo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Install build tools and libclang
        run: sudo apt-get update -qq && sudo apt-get install -y pkg-config libclang-dev gcc g++ binutils unzip libnss3-tools libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libxt6
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Build pinned bridge, runtime and license inventory
        run: python3 scripts/build_neqo.py
      - name: Rust format, clippy and ABI tests
        shell: bash
        run: |
          set -euo pipefail
          source rust/neqo-bridge/target/foxtunnel-build/env.sh
          cd rust/neqo-bridge
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --release
      - name: Neqo interop, trust and UDP fallback with race detector
        shell: bash
        run: |
          set -euo pipefail
          source rust/neqo-bridge/target/foxtunnel-build/env.sh
          python3 scripts/check_core_boundaries.py --tags nss,neqo
          go vet -tags nss,neqo ./...
          go test -race -tags nss,neqo ./... -count=1 -timeout=180s
          (cd integration/external && go test -race -tags nss,neqo ./... -count=1 -timeout=30s)
          go test -race -tags nss,neqo ./internal/tunnel -run '^TestSecurityStage5ManagedUDPIsolationNeqo$' -count=3 -timeout=120s
          go test -race -tags nss,neqo ./internal/tunnel -run '^TestStage4Neqo' -count=3 -timeout=120s
          go test -race -tags nss,neqo ./internal/neqo ./internal/tunnel -run 'TestNeqo|TestQUIC|TestIndependentH3|TestBlockedUDP|TestALPNFailure|TestConcurrentDuplex|TestTrustBeforeCredentials|TestRealQUIC|TestPeerReset|TestMalformed' -count=3 -timeout=60s
      - name: Repeat native lifecycle with strict cgo pointer checks
        shell: bash
        run: |
          set -euo pipefail
          source rust/neqo-bridge/target/foxtunnel-build/env.sh
          GOEXPERIMENT=cgocheck2 go test -race -tags nss,neqo ./internal/neqo -run '^TestStage6|^TestUpdate' -count=5 -timeout=120s
          GOEXPERIMENT=cgocheck2 go test -race -tags nss,neqo ./internal/nsstls -run '^TestConcurrentCloseUnblocksRead$|^TestHandshakeCancellation$|^TestStage3NSS' -count=8 -timeout=120s
      - name: Verify explicit backend reporting
        shell: bash
        run: |
          set -euo pipefail
          source rust/neqo-bridge/target/foxtunnel-build/env.sh
          go build -tags nss,neqo -o /tmp/foxtunnel-neqo ./cmd/foxtunnel
          /tmp/foxtunnel-neqo version --json > /tmp/neqo-version.json
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/neqo-version.json'))
          assert v['neqo_version']=='0.33.0' and v['nss_version']=='3.130'
          assert v['quic_backends']==['quic-go','neqo']
          PY
      - name: Comparable native CPU RSS throughput and allocations
        shell: bash
        run: |
          set -euo pipefail
          source rust/neqo-bridge/target/foxtunnel-build/env.sh
          python3 -m unittest discover -s scripts -p test_build_neqo.py
          python3 -m unittest discover -s scripts -p test_native_backend_metrics.py
          go test -c -tags nss,neqo -o /tmp/native-backend.test ./internal/tunnel
          python3 scripts/native_backend_metrics.py --binary /tmp/native-backend.test --versions /tmp/neqo-version.json --out /tmp/native-backend-metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-backend-metrics
          path: /tmp/native-backend-metrics.json
          if-no-files-found: error
          retention-days: 7
      - name: Update stage 5 paired H3 baseline and Go-side profiles
        if: github.ref == 'refs/heads/update'
        shell: bash
        run: |
          set -euo pipefail
          source rust/neqo-bridge/target/foxtunnel-build/env.sh
          python3 -m unittest discover -s scripts -p 'test_update_h3_*.py' -v
          cc -O2 -Wall -Wextra -Werror scripts/native_resource_runner.c -o /tmp/native-resource-runner
          python3 scripts/update_h3_profile.py --binary /tmp/native-backend.test --versions /tmp/neqo-version.json --resource-runner /tmp/native-resource-runner --out /tmp/update-h3-profile.json
      - name: Update stage 5 immutable before-after H3 comparison
        if: github.ref == 'refs/heads/update'
        shell: bash
        run: |
          set -euo pipefail
          source rust/neqo-bridge/target/foxtunnel-build/env.sh
          base=191871b51a00627ce79b28d6c103168da77ab84f
          git worktree add --detach "$RUNNER_TEMP/update-h3-base" "$base"
          ln -s "$GITHUB_WORKSPACE/rust/neqo-bridge/target" "$RUNNER_TEMP/update-h3-base/rust/neqo-bridge/target"
          cp internal/neqo/build_stamp.h "$RUNNER_TEMP/update-h3-base/internal/neqo/build_stamp.h"
          (cd "$RUNNER_TEMP/update-h3-base" && go test -c -tags nss,neqo -o /tmp/update-h3-base.test ./internal/tunnel)
          python3 scripts/update_h3_compare.py --base /tmp/update-h3-base.test --head /tmp/native-backend.test --base-commit "$base" --head-commit "$(git rev-parse HEAD)" --resource-runner /tmp/native-resource-runner --out /tmp/update-h3-comparison.json
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/update'
        with:
          name: update-h3-profile
          path: |
            /tmp/update-h3-profile.json
            /tmp/update-h3-comparison.json
          if-no-files-found: error
          retention-days: 14
      - name: Fresh pinned Firefox NaiveProxy FoxTunnel TLS H2 and decoded H3
        shell: bash
        run: |
          set -euo pipefail
          source rust/neqo-bridge/target/foxtunnel-build/env.sh
          go build -tags nss,neqo -o /tmp/native-wire-capture ./experiments/wire-capture
          go test -race -tags nss,neqo ./experiments/browser-compare -count=1 -timeout=60s
          python3 -m unittest discover -s scripts -p test_compare_browser_behavior.py -v
          go build -tags nss,neqo -o /tmp/browser-compare ./experiments/browser-compare
          python3 scripts/capture_native_wire.py --endpoint /tmp/native-wire-capture --behavior-endpoint /tmp/browser-compare --out /tmp/native-wire-observations
          python3 scripts/fingerprint_audit.py --firefox /tmp/native-wire-observations/firefox-h2.json --foxtunnel /tmp/native-wire-observations/foxtunnel-h2.json --naive /tmp/native-wire-observations/naive-h2.json --firefox-quic /tmp/native-wire-observations/firefox-h3.json --foxtunnel-quic /tmp/native-wire-observations/foxtunnel-h3.json --naive-quic /tmp/native-wire-observations/naive-h3.json --out /tmp/native-wire-observations/comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-wire-observations
          path: /tmp/native-wire-observations/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain provenance and dependency license inventory
        uses: actions/upload-artifact@v4
        with:
          name: neqo-experiment-provenance
          path: |
            scripts/neqo.lock.json
            rust/neqo-bridge/Cargo.lock
            rust/neqo-bridge/target/foxtunnel-build/provenance.json
            rust/neqo-bridge/target/foxtunnel-build/rust-dependencies.json
            rust/neqo-bridge/target/foxtunnel-build/licenses/
            rust/neqo-bridge/target/foxtunnel-build/mozilla-runtime/licenses/
