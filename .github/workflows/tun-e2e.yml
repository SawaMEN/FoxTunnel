name: Linux TUN FoxTunnel sing-box end-to-end lab
on:
  push:
    branches: [main]
    paths:
      - "scripts/linux_tun_companion.py"
      - "scripts/test_linux_tun_e2e.py"
      - ".github/workflows/tun-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tun-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install isolated networking requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 nftables openssl
      - name: Build FoxTunnel directly from checked out sources
        run: go build -o "$RUNNER_TEMP/foxtunnel" ./cmd/foxtunnel
      - name: Download pinned upstream sing-box and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          version=1.14.1
          asset="sing-box-${version}-linux-amd64.tar.gz"
          url="https://github.com/SagerNet/sing-box/releases/download/v${version}/${asset}"
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/${asset}" "$url"
          echo "12cb2816b52febb356f6a885b740cc8758c3f30b8ae0ca8edba80f0d2d35343f  $RUNNER_TEMP/${asset}" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/${asset}" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/sing-box-${version}-linux-amd64/sing-box" version
      - name: FoxTunnel TLS + sing-box TUN + TCP/UDP/DNS and client-failure tests
        shell: bash
        run: |
          sudo env \
            FOXTUNNEL_TUN_E2E=1 \
            FOXTUNNEL_LAB_SINGBOX="$RUNNER_TEMP/sing-box-1.14.1-linux-amd64/sing-box" \
            FOXTUNNEL_LAB_FOXTUNNEL="$RUNNER_TEMP/foxtunnel" \
            python3 -m unittest discover -s scripts -p test_linux_tun_e2e.py -v
      - name: Describe evidence boundary
        run: |
          echo "Isolated Linux netns end-to-end test ONLY."
          echo "No ISP censorship resilience, production DNS leak audit, multi-homed failover, or native FoxTunnel TUN claim."
