name: Mozilla unified bundle (build only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mozilla-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Install pinned native build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libclang-dev gcc g++ binutils unzip
          rustup toolchain install 1.99.1 --profile minimal
      - name: Package Go + NSS + Neqo Mozilla flavor (no test suite)
        run: python3 scripts/build_mozilla.py --version v0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: vetroff-linux-amd64-mozilla
          path: |
            dist/*.tar.gz
            dist/*.metadata.json
          if-no-files-found: error
