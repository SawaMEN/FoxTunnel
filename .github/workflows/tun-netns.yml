name: Linux TUN nftables network-namespace laboratory
on:
  push:
    branches: [main, up]
    paths:
      - "scripts/linux_tun_companion.py"
      - "scripts/test_linux_tun_companion.py"
      - "scripts/test_linux_tun_netns.py"
      - ".github/workflows/tun-netns.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nft-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install namespace and nftables utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 nftables
      - name: Offline Python tests
        run: python3 -m unittest discover -s scripts -p test_linux_tun_companion.py -v
      - name: Isolated network namespaces - real kernel packet checks
        run: |
          sudo -E env FOXTUNNEL_TUN_NETNS=1 python3 -m unittest discover -s scripts -p test_linux_tun_netns.py -v
      - name: Evidence boundaries
        run: |
          echo "Only nftables IPv4/IPv6/DNS and fail-closed guard have live network coverage."
          echo "TUN, sing-box, and end-to-end FoxTunnel have NOT been tested by this job."
