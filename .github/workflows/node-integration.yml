name: Node routing integration and benchmarks

on:
  pull_request:
    paths:
      - '.github/workflows/node-integration.yml'
      - 'internal/bond/**'
      - 'internal/multihop/**'
      - 'internal/nodeperf/**'
      - 'internal/tunnel/**'
      - 'internal/profile/**'
      - 'cmd/vetroff/**'
      - 'foxtunnel*.go'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - '.github/workflows/node-integration.yml'
      - 'internal/bond/**'
      - 'internal/multihop/**'
      - 'internal/nodeperf/**'
      - 'internal/tunnel/**'
      - 'internal/profile/**'
      - 'cmd/vetroff/**'
      - 'foxtunnel*.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  verify-node-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - name: Race detector for routing and core
        run: go test -race ./internal/nodeperf ./internal/multihop ./internal/bond ./internal/tunnel ./internal/profile -count=1 -timeout=120s
      - name: Build client
        run: go build ./cmd/vetroff
      - name: Multi-ingress HTTP/2 integrity and adaptive scheduler regression
        run: |
          go test ./internal/bond -run '^TestAdaptive(BondHTTP2MultiIngressIntegrity|Pick)' -count=3 -timeout=120s
      - name: Traffic-aware scheduling and HTTP/2 integration
        run: |
          go test ./internal/bond -run '^TestTraffic' -count=3 -timeout=120s
          go test ./internal/tunnel -run '^Test(BondTraffic|DiscoveredBondTraffic)' -count=3 -timeout=120s
      - name: UDP independent-flow sharding regression
        run: |
          go test ./internal/tunnel -run '^Test(UDPMultiNode|UDPIngress)' -count=3 -timeout=120s
          go test -race ./internal/tunnel -run '^Test(UDPMultiNode|UDPIngress)' -count=1 -timeout=120s
      - name: Capture isolated selection microbenchmarks
        run: |
          go test ./internal/bond -run '^$' -bench 'BenchmarkBond(PathSelection|SkewAndQueue|AdaptivePick)' -benchmem -benchtime=300ms -count=3 | tee node-bench.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-benchmarks
          path: node-bench.txt
          if-no-files-found: ignore
