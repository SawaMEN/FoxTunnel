name: Linux TUN VPN experiment
on:
  push:
  pull_request:
jobs:
  kernel-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - name: Install isolated network test tools
        run: sudo apt-get update -qq && sudo apt-get install -y iproute2 nftables openssl
      - name: Build the real client and server
        run: go build -o /tmp/foxtunnel ./cmd/foxtunnel
      - name: Kernel TCP UDP IPv6 DNS and persistent kill switch
        run: sudo unshare --mount --net --pid --fork --mount-proc python3 scripts/test_linux_vpn_network.py --binary /tmp/foxtunnel
