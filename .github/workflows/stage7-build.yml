name: Stage 7 integration build audit (no tests)

on:
  push:
    branches: [update]
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'foxtunnel*.go'
      - 'rust/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/stage7-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Show exact Go formatter changes (no tests)
        shell: bash
        run: |
          set -euo pipefail
          gofmt -d cmd internal examples foxtunnel*.go integration/external | tee /tmp/format.diff
          if [[ -s /tmp/format.diff ]]; then
            echo 'Go formatting differs from gofmt; see diff above'
            exit 1
          fi

  portable-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - name: Compile Go CLI and SDK packages (no test execution)
        run: |
          go build -mod=readonly ./cmd/foxtunnel
          go build -mod=readonly ./...

  mozilla-amd64-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - name: Install pinned build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libclang-dev gcc g++ binutils unzip
          rustup toolchain install 1.99.1 --profile minimal
      - name: Build NSS/Neqo Mozilla bundle without running the executable or tests
        run: python3 scripts/build_mozilla.py --version v0.0.0-ci
      - name: Upload untested native bundle and provenance
        uses: actions/upload-artifact@v4
        with:
          name: stage7-foxtunnel-mozilla-amd64-untested
          path: |
            dist/*.tar.gz
            dist/*.metadata.json
          if-no-files-found: error
          retention-days: 7
