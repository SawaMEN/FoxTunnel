name: Tests
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check format
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./... -count=1 -timeout=60s
      - name: Fuzz padding decoder
        run: go test ./internal/tunnel -run '^$' -fuzz FuzzPaddingDecoder -fuzztime=10s -parallel=2
      - name: Build
        run: go build ./cmd/foxtunnel
