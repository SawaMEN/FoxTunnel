name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read

concurrency:
  # Cancel superseded commits/PRs; never cancel a called Neqo release gate.
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Check format
        run: |
          gofmt -d cmd internal examples processhost vetroff*.go integration/external
          test -z "$(gofmt -l cmd internal examples processhost vetroff*.go integration/external)"
      - name: Check documentation links
        run: python3 scripts/check_docs_links.py
      - name: Firefox prototype SOCKS parser (no native runtime claim)
        run: node --test experiments/firefox-necko/client_test.cjs
      - name: Enforce protocol-core boundaries
        run: python3 scripts/check_core_boundaries.py
      - name: Check module dependency hygiene
        run: |
          go mod tidy -diff
          cd integration/external
          go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./... -count=1 -timeout=120s
      - name: Fuzz protocol capability parsing
        run: go test ./internal/tunnel -run '^$' -fuzz '^FuzzProtocolTokens$' -fuzztime=10000x -parallel=2 -timeout=60s
      - name: Fuzz padding decoder
        run: go test ./internal/tunnel -run '^$' -fuzz FuzzPaddingDecoder -fuzztime=100000x -parallel=2 -timeout=120s
      - name: Фаззинг ссылок vetroff
        run: go test ./internal/profile -run '^$' -fuzz FuzzLinkDecoder -fuzztime=10000x -parallel=2 -timeout=60s
      - name: Release manifest integrity checks
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Independent external SDK consumer
        run: cd integration/external && go test -race ./... -count=1 -timeout=30s
      - name: Build
        run: go build ./cmd/vetroff
      - name: Проверка известных уязвимостей Go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Фаззинг состава кластера
        run: go test ./internal/cluster -run '^$' -fuzz FuzzClusterDecoder -fuzztime=10000x -parallel=2 -timeout=60s
      - name: Фаззинг путей XHTTP
        run: go test ./internal/xhttp -run '^$' -fuzz FuzzCarrierPath -fuzztime=10000x -parallel=2 -timeout=60s
      - name: Фаззинг настроек XHTTP
        run: go test ./internal/xhttp -run '^$' -fuzz FuzzSettings -fuzztime=10000x -parallel=2 -timeout=60s
