name: Tests
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Check format
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./... -count=1 -timeout=60s
      - name: Fuzz padding decoder
        run: go test ./internal/tunnel -run '^$' -fuzz FuzzPaddingDecoder -fuzztime=100000x -parallel=2 -timeout=120s
      - name: Фаззинг ссылок vetroff
        run: go test ./internal/profile -run '^$' -fuzz FuzzLinkDecoder -fuzztime=10000x -parallel=2 -timeout=60s
      - name: Build
        run: go build ./cmd/foxtunnel
      - name: Проверка известных уязвимостей Go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Фаззинг состава кластера
        run: go test ./internal/cluster -run '^$' -fuzz FuzzClusterDecoder -fuzztime=10000x -parallel=2 -timeout=60s
      - name: Фаззинг путей XHTTP
        run: go test ./internal/xhttp -run '^$' -fuzz FuzzCarrierPath -fuzztime=10000x -parallel=2 -timeout=60s
