name: One-time native TUN Go dependencies and formatting
on:
  push:
    paths:
      - ".github/workflows/native-tun-bootstrap.yml"

permissions:
  contents: write

jobs:
  pin-deps:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: Pin gVisor netstack via MIT-licensed Go tun2socks core
        run: |
          set -euo pipefail
          go get github.com/xjasonlyu/tun2socks/v2@v2.7.0
          go mod tidy
          gofmt -w cmd/foxtunnel/main.go internal/nativetun/*.go
          go test ./internal/nativetun -count=1
      - name: Commit go.mod/go.sum and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/native-tun-bootstrap.yml
          git add go.mod go.sum cmd/foxtunnel/main.go internal/nativetun
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build: pin and format embedded native Linux TUN dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
