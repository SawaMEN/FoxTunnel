name: Native FoxTunnel Linux TUN end-to-end
on:
  push:
    branches: [main, up]
    paths:
      - "internal/nativetun/**"
      - "cmd/foxtunnel/main.go"
      - "go.mod"
      - "go.sum"
      - "scripts/test_linux_tun_e2e.py"
      - ".github/workflows/native-tun-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tun:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Offline TCP/UDP parser and cancelled SOCKS handshake tests
        run: go test -race ./internal/nativetun -count=2 -timeout=90s
      - name: Build FoxTunnel including embedded userspace TCP/IP stack
        run: go build -o "$RUNNER_TEMP/foxtunnel" ./cmd/foxtunnel
      - name: Install isolated network tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 nftables openssl
      - name: Native TUN IPv4 IPv6 TCP UDP DNS kill-switch and link loss
        run: |
          sudo env FOXTUNNEL_TUN_E2E=1 FOXTUNNEL_TUN_NATIVE=1 \
            FOXTUNNEL_LAB_FOXTUNNEL="$RUNNER_TEMP/foxtunnel" \
            python3 -m unittest discover -s scripts -p test_linux_tun_e2e.py -v
      - name: Test scope
        run: |
          echo "Direct gVisor TCP/IP stack in FoxTunnel binary, no sing-box process."
          echo "Isolated netns only; full DNS interception and production leak audits are not verified."
