name: Native platform operations

on:
  pull_request:
    paths:
      - 'cmd/foxtunnel/**'
      - 'internal/tunnel/**'
      - 'internal/tlsidentity/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/platform-operations.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/foxtunnel/**'
      - 'internal/tunnel/**'
      - 'internal/tlsidentity/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/platform-operations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operations:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - name: Native lifecycle, certificate renewal and listener release
        run: go test -race ./cmd/foxtunnel ./internal/tlsidentity ./internal/tunnel -run 'TestServerCertificateReloadAndShutdownH2H3|TestProcessSIGTERMAndCertificateSIGHUP|TestClientSIGTERMClosesIncompleteSOCKS|TestCertificateReloadRetainsLastValidPair|TestServeContextStopsActiveAndIncompleteConnections' -count=1 -timeout=90s
      - name: Build and execute native CLI
        shell: bash
        run: |
          go build -o foxtunnel-platform.exe ./cmd/foxtunnel
          ./foxtunnel-platform.exe version --json
      - name: Scope
        shell: bash
        run: |
          echo 'Go transport CLI tests execute on the native runner; no cross-compile-only claim.'
          echo 'Linux TUN remains Linux-only. Windows service management, installation, rollback, signing and Apple notarization are separate gates.'
