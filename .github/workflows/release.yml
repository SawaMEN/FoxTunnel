name: Versioned binaries
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    paths: ['cmd/**', 'internal/**', 'foxtunnel*.go', 'scripts/**', 'LICENSE', 'go.*', '.github/workflows/release.yml', '.github/release-request.json', 'docs/releases/**']
permissions:
  contents: read
jobs:
  request:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      source: ${{ steps.resolve.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve reviewed version request
        id: resolve
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/release_request.py
  quality:
    needs: [request]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - name: Validate source and release contract before packaging
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_docs_links.py
          go vet ./...
          go test -race ./... -count=1 -timeout=120s
          cd integration/external && go test -race ./... -count=1 -timeout=60s
  nss:
    needs: [request]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - name: Install NSS dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libnss3-dev libnspr4-dev pkg-config unzip binutils
      - name: Build NSS archive and execute version check
        env:
          RELEASE_TAG: ${{ needs.request.outputs.version }}
        run: python3 scripts/release.py build --version "$RELEASE_TAG" --os linux --arch '${{ matrix.arch }}' --backend nss --baseline ubuntu-24.04
      - name: Test pinned Mozilla runtime and isolated NSS data transfer
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/nss-package"
          mkdir -p "$package"
          tar -xzf dist/*_nss.tar.gz -C "$package"
          LD_LIBRARY_PATH="$package/lib" go test -race -tags nss ./... -count=1 -timeout=120s
          CGO_LDFLAGS='-Wl,--disable-new-dtags -Wl,-rpath,$ORIGIN/lib' go test -c -tags nss -o "$package/sdk.test" .
          docker run --rm --network none --read-only --tmpfs /tmp -v "$package:/release:ro" ubuntu:24.04 sh -ec '
            if ldconfig -p | grep -Eq "libnss3|libnspr4"; then exit 1; fi
            /release/foxtunnel version --json
            /release/sdk.test -test.run "^TestPublicNSS" -test.timeout=60s
          '
      - uses: actions/upload-artifact@v4
        with:
          name: nss-${{ matrix.arch }}-archive
          path: dist/*
          if-no-files-found: error
  index:
    needs: [request, quality, nss]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Validate two Linux NSS release archives
        env:
          RELEASE_TAG: ${{ needs.request.outputs.version }}
        run: |
          python3 scripts/release.py index --version "$RELEASE_TAG"
          python3 scripts/release.py verify --version "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
          if-no-files-found: error
  publish:
    if: needs.request.outputs.publish == 'true'
    needs: [request, index]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish immutable experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.request.outputs.version }}
          RELEASE_SOURCE: ${{ needs.request.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing release.' >&2
            exit 1
          fi
          tag_flags=(--verify-tag)
          if [ "$RELEASE_SOURCE" = request ]; then
            if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo 'Refusing to replace an existing tag for a release request.' >&2
              exit 1
            fi
            tag_flags=(--target "$GITHUB_SHA")
          fi
          notes=(--notes 'Experimental standalone FoxTunnel. Verify the archived build.json against the trusted release tag/commit and inspect archive contents. Linux NSS assets bundle Mozilla libraries; keep lib/ beside the executable. No production or censorship-resistance claim.')
          if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
            notes=(--notes-file "docs/releases/$RELEASE_TAG.md")
          fi
          gh release create "$RELEASE_TAG" dist/* "${tag_flags[@]}" --prerelease --title "FoxTunnel $RELEASE_TAG" "${notes[@]}"
