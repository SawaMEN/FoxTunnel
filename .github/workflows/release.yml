name: Versioned binaries
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    paths: ['cmd/**', 'internal/**', 'foxtunnel*.go', 'scripts/**', 'LICENSE', 'go.*', '.github/workflows/release.yml']
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build seven portable archives
        shell: bash
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.0-ci' }}
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 linux/armv7 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            python3 scripts/release.py build --version "$RELEASE_TAG" --os "${target%/*}" --arch "${target#*/}" --backend go
          done
      - uses: actions/upload-artifact@v4
        with:
          name: portable-archives
          path: dist/*
          if-no-files-found: error
  nss:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install NSS dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libnss3-dev libnspr4-dev pkg-config unzip binutils
      - name: Build NSS archive and execute version check
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.0-ci' }}
        run: python3 scripts/release.py build --version "$RELEASE_TAG" --os linux --arch '${{ matrix.arch }}' --backend nss --baseline ubuntu-24.04
      - name: Test pinned Mozilla runtime and isolated NSS data transfer
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/nss-package"
          mkdir -p "$package"
          tar -xzf dist/*_nss.tar.gz -C "$package"
          LD_LIBRARY_PATH="$package/lib" go test -race -tags nss ./... -count=1 -timeout=60s
          CGO_LDFLAGS='-Wl,--disable-new-dtags -Wl,-rpath,$ORIGIN/lib' go test -c -tags nss -o "$package/sdk.test" .
          docker run --rm --network none --read-only --tmpfs /tmp -v "$package:/release:ro" ubuntu:24.04 sh -ec '
            if ldconfig -p | grep -Eq "libnss3|libnspr4"; then exit 1; fi
            /release/foxtunnel version --json
            /release/sdk.test -test.run "^TestPublicNSS" -test.timeout=60s
          '
      - uses: actions/upload-artifact@v4
        with:
          name: nss-${{ matrix.arch }}-archive
          path: dist/*
          if-no-files-found: error
  index:
    needs: [portable, nss]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify complete nine-target release
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.0-ci' }}
        run: |
          python3 scripts/release.py index --version "$RELEASE_TAG"
          cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [index]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish immutable experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing release.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "FoxTunnel $RELEASE_TAG" --notes 'Experimental standalone FoxTunnel. Select the exact version, OS, architecture and build flavor from manifest.json; verify SHA256SUMS before running. Linux NSS assets include a hash-pinned Mozilla runtime; keep lib/ beside the executable. This is not a production or censorship-resistance claim.'
