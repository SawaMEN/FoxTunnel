name: Protocol core integration bundles
on:
  push:
    branches: [main, xfd, xfd-release]
    tags: ['v[0-9]*']
  pull_request:
    paths: ['cmd/**', 'internal/**', 'vetroff*.go', 'scripts/**', 'LICENSE', 'go.*', '.github/workflows/release.yml', '.github/release-request.json', 'docs/releases/**', 'docs/INTEGRATION.md', 'integration/contract.json']
permissions:
  contents: read
  actions: read
jobs:
  request:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      source: ${{ steps.resolve.outputs.source }}
      replace_commit: ${{ steps.resolve.outputs.replace_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test native source cache selection without GitHub API access
        run: python3 -m unittest discover -s scripts -p test_find_cached_necko.py -v
      - name: Resolve reviewed version request
        id: resolve
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/release_request.py
      - name: Verify replacement target exists before full Gecko compilation
        if: steps.resolve.outputs.publish == 'true' && steps.resolve.outputs.source == 'replacement'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.resolve.outputs.version }}
          EXPECTED_SHA: ${{ steps.resolve.outputs.replace_commit }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TARGET_TAG" --jq '.id' >/dev/null
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TARGET_TAG" --jq '.object.sha')
          test "$current" = "$EXPECTED_SHA" || { echo 'Release replacement tag mismatch' >&2; exit 1; }
  quality:
    # Full native/release verification runs only for an explicit publish request.
    if: needs.request.outputs.publish == 'true'
    needs: [request]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Validate source and release contract before packaging
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_docs_links.py
          python3 scripts/check_core_boundaries.py
          go mod tidy -diff
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          go test -race ./... -count=1 -timeout=120s
          cd integration/external && go test -race ./... -count=1 -timeout=60s
  nss:
    # Full native/release verification runs only for an explicit publish request.
    if: needs.request.outputs.publish == 'true'
    needs: [request]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Install NSS dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libnss3-dev libnspr4-dev pkg-config unzip binutils
      - name: Build NSS archive and execute version check
        env:
          RELEASE_TAG: ${{ needs.request.outputs.version }}
        run: python3 scripts/release.py build --version "$RELEASE_TAG" --os linux --arch '${{ matrix.arch }}' --backend nss --baseline ubuntu-24.04
      - name: Check called Go vulnerabilities in the NSS build
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags=nss ./...
      - name: Test pinned Mozilla runtime and isolated NSS data transfer
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/nss-package"
          mkdir -p "$package"
          tar -xzf dist/*_nss.tar.gz -C "$package"
          LD_LIBRARY_PATH="$package/lib" go test -race -tags nss ./... -count=1 -timeout=120s
          CGO_LDFLAGS='-Wl,--disable-new-dtags -Wl,-rpath,$ORIGIN/lib' go test -c -tags nss -o "$package/sdk.test" .
          docker run --rm --network none --read-only --tmpfs /tmp -v "$package:/release:ro" ubuntu:24.04 sh -ec '
            if ldconfig -p | grep -Eq "libnss3|libnspr4"; then exit 1; fi
            /release/vetroff version --json
            /release/sdk.test -test.run "^TestPublicNSS" -test.timeout=60s
          '
      - name: Install complete native NSS archive without changing host configuration
        env:
          RELEASE_TAG: ${{ needs.request.outputs.version }}
        shell: bash
        run: |
          python3 - <<'PYLAB'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          import deploy_cli
          archive = next(pathlib.Path('dist').glob('*_nss.tar.gz'))
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          home = pathlib.Path(os.environ['RUNNER_TEMP']) / 'installed-nss'
          manager = deploy_cli.Deployment(home)
          record = manager.install(archive, deploy_cli.digest(archive), os.environ['RELEASE_TAG'], commit, archive=True)
          executable, installed = manager.bundle(record['identity'])
          info = json.loads(subprocess.check_output([str(executable), 'version', '--json'], timeout=10))
          assert info['commit'] == commit and info['build_flavor'] == 'nss'
          assert info['nss_version'] and installed['build_flavor'] == 'nss'
          print('Verified native NSS archive installation and bundled runtime loading')
          PYLAB
      - name: Independent repeat build and versioned upgrade candidate
        env:
          RELEASE_TAG: ${{ needs.request.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-repeat-tmp"
          GOCACHE="$RUNNER_TEMP/release-repeat-cache" GOTMPDIR="$RUNNER_TEMP/release-repeat-tmp" python3 scripts/release.py build --version "$RELEASE_TAG" --os linux --arch '${{ matrix.arch }}' --backend nss --baseline ubuntu-24.04 --out "$RUNNER_TEMP/release-repeat"
          python3 scripts/release.py build --version v0.0.0-stage9-update.1 --os linux --arch '${{ matrix.arch }}' --backend nss --baseline ubuntu-24.04 --out "$RUNNER_TEMP/release-upgrade"
      - name: Real packaged install update rollback payload and published-archive interop
        env:
          RELEASE_TAG: ${{ needs.request.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_candidate.py --primary "$(find dist -name '*_nss.tar.gz')" --replica "$(find "$RUNNER_TEMP/release-repeat" -name '*_nss.tar.gz')" --upgrade "$(find "$RUNNER_TEMP/release-upgrade" -name '*_nss.tar.gz')" --version "$RELEASE_TAG" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/native-release-candidate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-candidate-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-release-candidate.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: nss-${{ matrix.arch }}-archive
          path: dist/*
          if-no-files-found: error
  neqo:
    # Full native/release verification runs only for an explicit publish request.
    if: needs.request.outputs.publish == 'true'
    needs: [request]
    uses: ./.github/workflows/neqo-experiment.yml
  native-cache:
    # A completed, trusted main-branch run with identical C++ build inputs
    # can supply Gecko for both architectures; packaging and runtime tests
    # still run against the exact current release commit.
    if: needs.request.outputs.publish == 'true'
    needs: [request]
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.lookup.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Locate verified native runtime for unchanged Gecko inputs
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/find_cached_necko.py --output "$GITHUB_OUTPUT"
  native-source:
    # Cold build is necessary only if no complete matching run was found.
    if: needs.native-cache.outputs.run_id == '0'
    needs: [request, native-cache]
    uses: ./.github/workflows/necko-experiment.yml
  necko:
    # Always package and validate for this release, even with reused Gecko.
    if: ${{ always() && needs.request.outputs.publish == 'true' && needs.native-cache.result == 'success' && (needs.native-source.result == 'success' || (needs.native-source.result == 'skipped' && needs.native-cache.outputs.run_id != '0')) }}
    needs: [request, native-cache, native-source]
    uses: ./.github/workflows/necko-runtime-test.yml
    with:
      release_version: ${{ needs.request.outputs.version }}
      source_run: ${{ needs.native-cache.outputs.run_id != '0' && needs.native-cache.outputs.run_id || github.run_id }}
  index:
    needs: [request, quality, nss, necko]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nss-*-archive
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: vetroff-necko-linux-${{ matrix.arch }}
          path: necko-release
      - name: Validate native input archives and combine matching architectures
        env:
          RELEASE_TAG: ${{ needs.request.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libnss3-dev libnspr4-dev pkg-config binutils libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libxt6
          python3 scripts/release.py index --version "$RELEASE_TAG"
          python3 scripts/release.py verify --version "$RELEASE_TAG" --commit "$GITHUB_SHA"
          (cd necko-release && sha256sum --check SHA256SUMS)
          mkdir -p published
          archive="published/vetroff_${RELEASE_TAG#v}_linux_${RELEASE_ARCH}.tar.gz"
          python3 scripts/merge_necko_nss.py --arch "$RELEASE_ARCH" --necko "necko-release/vetroff-necko-linux-${RELEASE_ARCH}.tar.gz" --nss "dist/vetroff_${RELEASE_TAG#v}_linux_${RELEASE_ARCH}_nss.tar.gz" --out "$archive" --version "$RELEASE_TAG" --commit "$GITHUB_SHA"
          python3 scripts/qualify_unified.py --archive "$archive" --nss "dist/vetroff_${RELEASE_TAG#v}_linux_${RELEASE_ARCH}_nss.tar.gz" --version "$RELEASE_TAG" --commit "$GITHUB_SHA" --arch "$RELEASE_ARCH" --install "$RUNNER_TEMP/unified-install" --report "published/linux-${RELEASE_ARCH}-verification.json"
          (cd published && sha256sum *.tar.gz > "SHA256SUMS-linux-${RELEASE_ARCH}")
      - name: Real NSS SDK transfers from the combined library directory
        shell: bash
        run: |
          set -euo pipefail
          bundle=$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path("published/linux-${{ matrix.arch }}-verification.json").read_text())["installed_bundle"])')
          LD_LIBRARY_PATH="$bundle/lib" go test -race -tags nss . -run '^TestPublicNSS' -count=1 -timeout=120s
      - name: Real unified CLI SDK identity and profile gates
        shell: bash
        run: |
          set -euo pipefail
          bundle=$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path("published/linux-${{ matrix.arch }}-verification.json").read_text())["installed_bundle"])')
          VETROFF_NECKO_BUNDLE="$bundle" LD_LIBRARY_PATH="$bundle/lib" go test -race -tags nss . ./experiments/firefox-necko -run '^Test(IntegratedNecko|GeckoManagedHTTP(Identity|NativeProfiles|NodePins))' -v -count=1 -timeout=600s
      - name: Record successful tests of the actual installed archive
        run: |
          python3 - <<'PYREPORT'
          import json, pathlib
          p = pathlib.Path('published/linux-${{ matrix.arch }}-verification.json')
          d = json.loads(p.read_text())
          d['status'] = 'qualified'
          d['checks'] += ['native-NSS-SDK-transfers', 'seven-carrier-unified-CLI-SDK', 'native-SNI-SPKI-node-pins-TLS-H2-profile-gates']
          p.write_text(json.dumps(d, indent=2, sort_keys=True) + '\n')
          PYREPORT
      - uses: actions/upload-artifact@v4
        with:
          name: unified-${{ matrix.arch }}-release-assets
          path: published/*
          if-no-files-found: error
          retention-days: 30
  publish:
    concurrency:
      group: publish-${{ needs.request.outputs.version }}
      cancel-in-progress: false
    if: github.event_name == 'push' && needs.request.outputs.publish == 'true'
    needs: [request, index, neqo]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: unified-*-release-assets
          merge-multiple: true
          path: dist
      - name: Verify the two published archives again before signing
        env:
          RELEASE_TAG: ${{ needs.request.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 2
          python3 scripts/unified_release_notes.py --input dist --version "$RELEASE_TAG" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/pre-sign-verified-release-notes.md"
      - name: Sign provenance for the exact release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.tar.gz
          create-storage-record: false
      - name: Verify signed provenance before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz; do
            gh attestation verify "$archive" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done
      - name: Publish verified experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.request.outputs.version }}
          RELEASE_SOURCE: ${{ needs.request.outputs.source }}
          REPLACE_COMMIT: ${{ needs.request.outputs.replace_commit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/unified_release_notes.py --input dist --version "$RELEASE_TAG" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/verified-release-notes.md"
          if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
            cat "docs/releases/$RELEASE_TAG.md" >> "$RUNNER_TEMP/verified-release-notes.md"
          fi
          cat docs/releases/necko-usage.md >> "$RUNNER_TEMP/verified-release-notes.md"
          python3 scripts/publish_release.py --version "$RELEASE_TAG" --commit "$GITHUB_SHA" \
            --source "$RELEASE_SOURCE" --replace-commit "$REPLACE_COMMIT" \
            --notes "$RUNNER_TEMP/verified-release-notes.md" --input dist
