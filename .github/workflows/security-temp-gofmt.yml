name: Temporary security gofmt

on:
  push:
    branches: [feature/security-hardening-tls-socks-secrets]
    paths:
      - '.github/workflows/security-temp-gofmt.yml'

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/security-hardening-tls-socks-secrets
          persist-credentials: true
      - name: Format new Go source
        run: |
          gofmt -w cmd/foxtunnel/main.go cmd/foxtunnel/main_test.go \
            internal/profile/secretfile.go internal/profile/secretfile_test.go \
            internal/tunnel/socks_auth.go internal/tunnel/socks_auth_test.go \
            internal/tunnel/nodetrust.go internal/tunnel/nodetrust_test.go \
            internal/tunnel/client.go internal/tunnel/identity.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add cmd/foxtunnel/main.go cmd/foxtunnel/main_test.go \
              internal/profile/secretfile.go internal/profile/secretfile_test.go \
              internal/tunnel/socks_auth.go internal/tunnel/socks_auth_test.go \
              internal/tunnel/nodetrust.go internal/tunnel/nodetrust_test.go \
              internal/tunnel/client.go internal/tunnel/identity.go
            git commit -m "style(security): apply gofmt"
            git push origin HEAD:feature/security-hardening-tls-socks-secrets
          fi
