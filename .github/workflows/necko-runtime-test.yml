name: Mozilla Necko runtime gates
on:
  push:
    branches: [firefox]
    paths:
      - 'experiments/firefox-necko/client.js'
      - 'experiments/firefox-necko/*.go'
      - 'experiments/firefox-necko/fingerprint/**'
      - 'scripts/compare_necko_firefox.py'
      - 'scripts/test_compare_necko_firefox.py'
      - '.github/workflows/necko-runtime-test.yml'
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Necko source workflow run that compiled this exact source lock'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select compiled runtime for this verification
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.source_run }}
        run: |
          source_run="$REQUESTED_RUN"
          if [ -z "$source_run" ]; then
            source_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/necko-experiment.yml/runs?branch=firefox&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          fi
          if ! [[ "$source_run" =~ ^[0-9]+$ ]]; then
            echo 'No compiled runtime found; run the source workflow first.' >&2
            exit 1
          fi
          echo "run_id=$source_run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: necko-linux-amd64-runtime
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: runtime-archive
      - uses: actions/download-artifact@v4
        with:
          name: necko-source-provenance
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: runtime-provenance
      - name: Install runtime libraries and diagnostic tools
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libxt6 strace gdb zstd
      - name: Extract and verify exact source and runtime hashes
        run: |
          mkdir runtime
          tar --no-same-owner --zstd -xf runtime-archive/runtime.tar.zst -C runtime
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = list(Path('runtime-provenance').rglob('provenance.json'))
          assert len(files) == 1, files
          p = json.loads(files[0].read_text())
          lock = json.loads(Path('experiments/firefox-necko/gecko.lock.json').read_text())
          assert p['source'] == lock, 'Runtime was built from a different source lock'
          assert p['status'] == 'built-not-interop-tested'
          for name, digest in p['runtime'].items():
              with (Path('runtime') / name).open('rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == digest, name
          print('Pinned compiled runtime verified')
          PY
      - name: Basic xpcshell startup with bounded diagnostics
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/runtime
          MOZ_DISABLE_SOCKET_PROCESS: '1'
        run: |
          set +e
          timeout -k 3 15 runtime/xpcshell -g "$PWD/runtime" -a "$PWD/runtime" -e 'print("xpcshell-ready")' > runtime-startup.log 2>&1
          result=$?
          cat runtime-startup.log
          if [ "$result" != 0 ]; then
            timeout -k 3 8 strace -f -tt -o runtime-startup.strace runtime/xpcshell -g "$PWD/runtime" -a "$PWD/runtime" -e 'print("xpcshell-ready")'
            tail -100 runtime-startup.strace
            runtime/xpcshell -g "$PWD/runtime" -a "$PWD/runtime" -e 'print("xpcshell-ready")' &
            runtime_pid=$!
            sleep 3
            sudo timeout -k 3 20 gdb -batch -ex 'set pagination off' -ex 'thread apply all bt' -p "$runtime_pid" > runtime-startup.stack 2>&1
            cat runtime-startup.stack
            kill "$runtime_pid"
            wait "$runtime_pid"
          fi
          exit "$result"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Native CONNECT, half-close and certificate trust gates
        env:
          FOXTUNNEL_XPCSHELL: ${{ github.workspace }}/runtime/xpcshell
        run: go test -race ./experiments/firefox-necko -run '^TestGecko' -v -count=1 -timeout=180s
      - name: Full Firefox wire comparison on the verified runtime
        env:
          FOXTUNNEL_XPCSHELL: ${{ github.workspace }}/runtime/xpcshell
          FOXTUNNEL_FINGERPRINT_OUT: ${{ github.workspace }}/necko-fingerprint/observations
        run: |
          go test -race ./experiments/firefox-necko -run '^Test(Fingerprint|GeckoBrowserFingerprint)' -v -count=3 -timeout=180s
          python3 scripts/compare_necko_firefox.py --observations necko-fingerprint/observations --out necko-fingerprint/comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: necko-firefox-fingerprint
          path: necko-fingerprint/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: necko-runtime-diagnostics
          path: |
            runtime-startup.log
            runtime-startup.strace
            runtime-startup.stack
          if-no-files-found: ignore
          retention-days: 7
