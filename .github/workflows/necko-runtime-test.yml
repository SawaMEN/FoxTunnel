name: Mozilla Necko runtime gates
on:
  push:
    branches: [main, firefox, fx, xfd]
    paths:
      - 'foxtunnel*.go'
      - 'necko_integration_test.go'
      - 'scripts/analyze_firefox_self.py'
      - 'scripts/evaluate_fx_fingerprint.py'
      - 'scripts/test_evaluate_fx_fingerprint.py'
      - 'scripts/report_fx_operations.py'
      - 'scripts/test_report_fx_operations.py'
      - 'experiments/firefox-necko/client_test.cjs'
      - 'experiments/firefox-necko/validation/baseline/client.js'
      - 'docs/FX.md'
      - 'scripts/collect_necko_licenses.py'
      - 'internal/tunnel/**'
      - 'internal/transportengine/**'
      - 'internal/buildinfo/**'
      - 'cmd/foxtunnel/**'
      - 'experiments/firefox-necko/client.js'
      - 'experiments/firefox-necko/gecko.lock.json'
      - 'experiments/firefox-necko/patches/**'
      - 'experiments/firefox-necko/*.go'
      - 'experiments/firefox-necko/fingerprint/**'
      - 'experiments/firefox-necko/cmd/**'
      - 'scripts/package_necko.py'
      - 'scripts/test_package_necko.py'
      - 'scripts/select_necko_runtime.py'
      - 'scripts/test_select_necko_runtime.py'
      - 'scripts/compare_necko_firefox.py'
      - 'scripts/test_compare_necko_firefox.py'
      - '.github/workflows/necko-runtime-test.yml'
  workflow_call:
    inputs:
      release_version:
        type: string
        default: v0.0.0-ci
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Necko source workflow run that compiled this exact source lock'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: necko-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Select compiled runtime for this verification
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.source_run }}
        run: |
          if [ -n "$REQUESTED_RUN" ]; then
            if ! [[ "$REQUESTED_RUN" =~ ^[0-9]+$ ]]; then
              echo 'Source run must be numeric.' >&2
              exit 1
            fi
            echo "run_id=$REQUESTED_RUN" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/select_necko_runtime.py --output "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: necko-linux-amd64-runtime
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: runtime-archive
      - uses: actions/download-artifact@v4
        with:
          name: necko-source-provenance
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: runtime-provenance
      - name: Install runtime libraries and diagnostic tools
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libxt6 strace gdb zstd
      - name: Extract and verify exact source and runtime hashes
        run: |
          mkdir runtime
          tar --no-same-owner --zstd -xf runtime-archive/runtime.tar.zst -C runtime
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = list(Path('runtime-provenance').rglob('provenance.json'))
          assert len(files) == 1, files
          p = json.loads(files[0].read_text())
          lock = json.loads(Path('experiments/firefox-necko/gecko.lock.json').read_text())
          assert p['source'] == lock, 'Runtime was built from a different source lock'
          assert p['status'] == 'built-not-interop-tested'
          for name, digest in p['runtime'].items():
              with (Path('runtime') / name).open('rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == digest, name
          print('Pinned compiled runtime verified')
          PY
      - name: Basic xpcshell startup with bounded diagnostics
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/runtime
          MOZ_DISABLE_SOCKET_PROCESS: '1'
        run: |
          set +e
          timeout -k 3 15 runtime/xpcshell -g "$PWD/runtime" -a "$PWD/runtime" -e 'print("xpcshell-ready")' > runtime-startup.log 2>&1
          result=$?
          cat runtime-startup.log
          if [ "$result" != 0 ]; then
            timeout -k 3 8 strace -f -tt -o runtime-startup.strace runtime/xpcshell -g "$PWD/runtime" -a "$PWD/runtime" -e 'print("xpcshell-ready")'
            tail -100 runtime-startup.strace
            runtime/xpcshell -g "$PWD/runtime" -a "$PWD/runtime" -e 'print("xpcshell-ready")' &
            runtime_pid=$!
            sleep 3
            sudo timeout -k 3 20 gdb -batch -ex 'set pagination off' -ex 'thread apply all bt' -p "$runtime_pid" > runtime-startup.stack 2>&1
            cat runtime-startup.stack
            kill "$runtime_pid"
            wait "$runtime_pid"
          fi
          exit "$result"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: FX buffer and fingerprint audit unit regressions
        run: |
          node --test experiments/firefox-necko/client_test.cjs
          python3 -m unittest discover -s scripts -p 'test_evaluate_fx_fingerprint.py' -v
          python3 -m unittest discover -s scripts -p 'test_report_fx_operations.py' -v
      - name: Native CONNECT, half-close and certificate trust gates
        env:
          FOXTUNNEL_XPCSHELL: ${{ github.workspace }}/runtime/xpcshell
        run: go test -race ./experiments/firefox-necko -run '^TestGecko' -v -count=1 -timeout=180s
      - name: Full Firefox wire comparison on the verified runtime
        env:
          FOXTUNNEL_XPCSHELL: ${{ github.workspace }}/runtime/xpcshell
          FOXTUNNEL_FINGERPRINT_OUT: ${{ github.workspace }}/necko-fingerprint/observations
        run: |
          go test -race ./experiments/firefox-necko -run '^Test(Fingerprint|GeckoBrowserFingerprint|GeckoFirefoxSelfComparison)' -v -count=3 -timeout=180s
          python3 scripts/compare_necko_firefox.py --observations necko-fingerprint/observations --out necko-fingerprint/comparison.json
          python3 scripts/analyze_firefox_self.py --observations necko-fingerprint/observations/firefox-self --out necko-fingerprint/firefox-self.json
          python3 scripts/evaluate_fx_fingerprint.py --candidate necko-fingerprint/comparison.json --control necko-fingerprint/firefox-self.json --out necko-fingerprint/fx-audit.json --enforce
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: necko-firefox-fingerprint
          path: necko-fingerprint/
          if-no-files-found: ignore
          retention-days: 14
      - name: Operational bounds, path outage and QUIC NAT rebinding
        env:
          FOXTUNNEL_XPCSHELL: ${{ github.workspace }}/runtime/xpcshell
        run: go test -race ./experiments/firefox-necko -run '^Test(GeckoIdleAndDrainLimits|GeckoNetworkRecovery|NetworkRelayPeers|Bundle|Lifetime)' -v -count=3 -timeout=180s
      - name: Package and verify opt-in Linux amd64 launcher
        env:
          RELEASE_VERSION: ${{ inputs.release_version || 'v0.0.0-ci' }}
        run: |
          python3 -m unittest discover -s scripts -p test_package_necko.py -v
          stamp="-s -w -X github.com/SawaMEN/FoxTunnel/internal/buildinfo.Version=$RELEASE_VERSION -X github.com/SawaMEN/FoxTunnel/internal/buildinfo.Commit=$GITHUB_SHA -X github.com/SawaMEN/FoxTunnel/internal/buildinfo.Dirty=false"
          go build -trimpath -ldflags="$stamp" -o necko-launcher ./experiments/firefox-necko/cmd/foxtunnel-necko
          go build -trimpath -ldflags="$stamp" -o necko-main-cli ./cmd/foxtunnel
          python3 scripts/collect_necko_licenses.py --out /tmp/necko-notices.txt
          cmp /tmp/necko-notices.txt experiments/firefox-necko/LICENSES.go.txt
          provenance=$(find runtime-provenance -name provenance.json -type f)
          python3 scripts/package_necko.py --runtime runtime --provenance "$provenance" --launcher necko-launcher --cli necko-main-cli --out necko-bundle --archive foxtunnel-necko-linux-amd64.tar.gz
          necko-bundle/foxtunnel-necko --bundle "$PWD/necko-bundle" --verify
          sha256sum foxtunnel-necko-linux-amd64.tar.gz > SHA256SUMS
      - name: Real H2/H3 transfer and SIGTERM from packaged launcher
        env:
          FOXTUNNEL_BUNDLE: ${{ github.workspace }}/necko-bundle
        run: go test -race ./experiments/firefox-necko -run '^TestGeckoPackagedLauncher$' -v -count=1 -timeout=90s
      - name: Integrated main CLI and SDK native gates
        env:
          FOXTUNNEL_NECKO_BUNDLE: ${{ github.workspace }}/necko-bundle
        run: go test -race . ./experiments/firefox-necko -run '^Test(IntegratedNecko|GeckoManaged(IPC|UDPStream))'  -v -count=1 -timeout=120s
      - name: Managed engine Firefox wire comparison
        env:
          FOXTUNNEL_XPCSHELL: ${{ github.workspace }}/runtime/xpcshell
          FOXTUNNEL_FINGERPRINT_BUNDLE: ${{ github.workspace }}/necko-bundle
          FOXTUNNEL_FINGERPRINT_OUT: ${{ github.workspace }}/necko-integrated-fingerprint/observations
        run: |
          go test -race ./experiments/firefox-necko -run '^TestGeckoBrowserFingerprint$' -v -count=3 -timeout=180s
          python3 scripts/compare_necko_firefox.py --observations necko-integrated-fingerprint/observations --out necko-integrated-fingerprint/comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: necko-integrated-fingerprint
          path: necko-integrated-fingerprint/
          if-no-files-found: ignore
          retention-days: 14
      - name: Sustained native resource measurements
        env:
          FOXTUNNEL_XPCSHELL: ${{ github.workspace }}/runtime/xpcshell
          FOXTUNNEL_SOAK_SECONDS: '300'
          FOXTUNNEL_OPERATIONS_OUT: ${{ github.workspace }}/necko-operations
        run: go test -race ./experiments/firefox-necko -run '^TestGeckoSoak$' -v -count=1 -timeout=720s
      - name: FX pinned pre-optimization paired control (60 seconds per protocol)
        env:
          FOXTUNNEL_XPCSHELL: ${{ github.workspace }}/runtime/xpcshell
          FOXTUNNEL_SOAK_SECONDS: '60'
          FOXTUNNEL_SOAK_VARIANT: baseline
          FOXTUNNEL_OPERATIONS_OUT: ${{ github.workspace }}/necko-operations-paired-baseline
        run: go test -race ./experiments/firefox-necko -run '^TestGeckoSoak$' -v -count=1 -timeout=240s
      - name: FX current paired workload (60 seconds per protocol)
        env:
          FOXTUNNEL_XPCSHELL: ${{ github.workspace }}/runtime/xpcshell
          FOXTUNNEL_SOAK_SECONDS: '60'
          FOXTUNNEL_SOAK_VARIANT: current
          FOXTUNNEL_OPERATIONS_OUT: ${{ github.workspace }}/necko-operations-paired-current
        run: go test -race ./experiments/firefox-necko -run '^TestGeckoSoak$' -v -count=1 -timeout=240s
      - name: FX resource efficiency report
        run: |
          python3 scripts/report_fx_operations.py --current necko-operations --reference experiments/firefox-necko/validation/stage4/ci-300s --out necko-operations/fx-resource-report.json
          python3 scripts/report_fx_operations.py --current necko-operations-paired-current --paired-baseline necko-operations-paired-baseline --out necko-operations/paired-fx-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: foxtunnel-necko-linux-amd64
          path: |
            foxtunnel-necko-linux-amd64.tar.gz
            SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: necko-operations
          path: necko-operations/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: necko-runtime-diagnostics
          path: |
            runtime-startup.log
            runtime-startup.strace
            runtime-startup.stack
          if-no-files-found: ignore
          retention-days: 7
